<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowzapp Contábil PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="theme-color" content="#10B981">
</head>
<body class="bg-gradient-to-br from-emerald-500 to-emerald-700 min-h-screen p-8 font-sans">
  <div class="max-w-4xl mx-auto">
    <div class="bg-white/10 backdrop-blur-xl rounded-3xl p-12 border border-white/20 shadow-2xl">
      <h1 class="text-5xl font-black text-white text-center mb-12 bg-gradient-to-r from-white to-emerald-100 bg-clip-text">Flowzapp</h1>
      <p class="text-emerald-100 text-xl text-center mb-16 opacity-90">Contabilidade Automatizada WhatsApp + NFC-e</p>
      
      <div class="grid md:grid-cols-3 gap-8 mb-12">
        <div class="bg-white/5 p-8 rounded-2xl border border-white/10 hover:bg-white/10 transition-all">
          <h3 class="text-2xl font-bold text-white mb-4">📱 WhatsApp</h3>
          <input class="w-full p-4 bg-white/20 rounded-xl border border-white/30 text-white placeholder-emerald-200 mb-4" placeholder="5511999999999">
          <input class="w-full p-4 bg-white/20 rounded-xl border border-white/30 text-white placeholder-emerald-200 mb-6" placeholder="NFC-e emitida...">
          <button class="w-full bg-emerald-500 hover:bg-emerald-600 p-4 rounded-2xl text-white font-bold text-lg transition-all">🚀 Enviar</button>
        </div>
        
        <div class="bg-white/5 p-8 rounded-2xl border border-white/10">
          <h3 class="text-2xl font-bold text-white mb-6">🔄 Hiper NFC-e</h3>
          <div class="space-y-3 mb-8">
            <div class="flex justify-between text-emerald-200"><span>NFC-e Hoje</span><span class="font-bold text-white">47</span></div>
            <div class="flex justify-between text-emerald-200"><span>SIEG Sync</span><span class="text-emerald-400">✅ OK</span></div>
          </div>
          <button class="w-full bg-yellow-500 hover:bg-yellow-600 p-4 rounded-2xl text-white font-bold">Sincronizar</button>
        </div>
        
        <div class="bg-white/5 p-8 rounded-2xl border border-white/10">
          <h3 class="text-2xl font-bold text-white mb-6">👥 Ramais</h3>
          <div class="space-y-2 text-sm">
            <div class="flex justify-between"><span class="text-emerald-200">Fiscal</span><span class="text-emerald-400">12 online</span></div>
            <div class="flex justify-between"><span class="text-gray-300">Contábil</span><span class="text-gray-400">3 online</span></div>
          </div>
        </div>
      </div>
      
      <div class="grid md:grid-cols-2 gap-8">
        <div class="bg-white/5 p-8 rounded-2xl border border-white/10">
          <h3 class="text-2xl font-bold text-white mb-6">📊 Status</h3>
          <div class="space-y-4 text-sm">
            <div class="flex justify-between"><span>Z-API</span><span class="text-emerald-400">🟢 8/10</span></div>
            <div class="flex justify-between"><span>FiqOn</span><span class="text-emerald-400">🟢 187/200</span></div>
            <div class="flex justify-between"><span>Hiper</span><span class="text-yellow-400">🟡 Sync</span></div>
          </div>
        </div>
        
        <div class="bg-white/5 p-8 rounded-2xl border border-white/10 md:col-span-2">
          <h3 class="text-2xl font-bold text-white mb-6">🎯 Próximos Passos</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <button class="bg-emerald-500/80 hover:bg-emerald-600 p-6 rounded-2xl text-white font-bold text-center transition-all">1. Z-API Token</button>
            <button class="bg-yellow-500/80 hover:bg-yellow-600 p-6 rounded-2xl text-white font-bold text-center transition-all">2. FiqOn Grátis</button>
            <button class="bg-purple-500/80 hover:bg-purple-600 p-6 rounded-2xl text-white font-bold text-center transition-all">3. 1º Cliente</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
